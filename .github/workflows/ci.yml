name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Type check & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check (api)
        working-directory: apps/api
        run: bun run tsc --noEmit

      - name: Type check (web)
        working-directory: apps/web
        run: bun run tsc --noEmit
